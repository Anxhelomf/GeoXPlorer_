        // Funktion, um einen zufälligen Standort aus der Liste zu erhalten
        function getRandomLocation() {
            return locations[Math.floor(Math.random() * locations.length)];
        }

        // Funktion zur Initialisierung der Karte
        function initializeMap() {
            map = L.map('map', {
                minZoom: 1,
                maxZoom: 17
            }).setView([0, 0], 2);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a>'
            }).addTo(map);

            // Klick-Event auf der Karte, um einen Marker zu setzen
            map.on('click', function(e) {
                var coord = e.latlng;
                var lat = coord.lat;
                var lng = coord.lng;

                if (marker) {
                    map.removeLayer(marker);
                }

                marker = L.marker([lat, lng]).addTo(map);

                console.log("Coordinates: " + lat + ", " + lng);
            });
        }

        // Funktion zur Starten des Timers
        function startTimer(duration, display) {
            var timer = duration, minutes, seconds;
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                display.textContent = minutes + ":" + seconds;
                if (timer < 15) {
                    var timerDisplay = document.getElementById('timer');
                        timerDisplay.style.display = 'block';
                        //document.getElementById('timer').style.display = 'block';
                };
                if (--timer < 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        const guessbtn = document.getElementById("guessbtn");
        guessbtn.addEventListener("click", function() {
            clearInterval(timerInterval);
            endGame();
            map.off('click'); 
        });

        var gameEnded = false;

        // Funktion zur Beendigung des Spiels
        async function endGame() {
            gameEnded = true;

            const mapElement = document.getElementById('map');
            if (mapElement._mouseoverListener && mapElement._mouseoutListener) {
                mapElement.removeEventListener('mouseover', mapElement._mouseoverListener);
                mapElement.removeEventListener('mouseout', mapElement._mouseoutListener);
            }

            var button = document.getElementById("btn12");
            var button2 = document.getElementById("guessbtn");
            button.style.display = "block";
            button2.style.display = "none";
            var streetViewIframe = document.getElementById('streetview');
            streetViewIframe.style.display = 'none';

            var mapContainer = document.querySelector('.map-container');
            mapContainer.style.position = 'absolute';
            mapContainer.style.top = '10px';
            mapContainer.style.left = '0';
            mapContainer.style.width = '100vw';
            mapContainer.style.height = '82vh';
            mapContainer.style.margin = '0';

            mapElement.style.width = '100%';
            mapElement.style.height = '100%';

            map.invalidateSize();

            var correctLatLng = L.latLng(randomLocation.coords[0], randomLocation.coords[1]);
            map.setView(correctLatLng, 18);

            var flagIcon = L.icon({
                iconUrl: 'flag.png',
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });

            L.marker(correctLatLng, { icon: flagIcon }).addTo(map);

            var distanceKM2 = document.getElementById('distanceKM2');

            if (marker) {
                var markerLatLng = marker.getLatLng();
                var polyline = L.polyline([markerLatLng, correctLatLng], { color: 'red' }).addTo(map);

                polyline.bringToFront();
                polyline.setLatLngs([markerLatLng, correctLatLng]);

                var distance = markerLatLng.distanceTo(correctLatLng);
                var distanceKM = distance / 1000;
                var distanceWithCommas = distanceKM.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

                var distanceWithoutCommas = distanceKM.toLocaleString('en-US', { maximumFractionDigits: 0 }).replace(/,/g, '');
                console.log(distanceKM);

                if (distanceKM < 10) {
                    distanceKM2.innerHTML = `Your Guess was <span style="display: inline-block;"><pre><code class="code-block">${distanceWithCommas}KM</code></pre></span> from the correct Location!`;
                } else {
                    distanceKM2.innerHTML = `Your Guess was <span style="display: inline-block;"><pre><code class="code-block">${distanceWithoutCommas}KM</code></pre></span> from the correct Location!`;
                }

                var bounds = L.latLngBounds(markerLatLng, correctLatLng);

                var zoomLevel = 10;
                var duration = 6;
                if (distance < 1000) { 
                    zoomLevel = 14;
                    duration = 4;
                } else if (distance < 5000) { 
                    zoomLevel = 12;
                    duration = 5;
                }

                map.flyToBounds(bounds, {
                    duration: duration,
                    easeLinearity: 0.5,
                    maxZoom: zoomLevel,
                });
            } else {
                map.flyTo(correctLatLng, 16, {
                    duration: 1.5,
                    easeLinearity: 0.5
                });

                distanceKM2.innerHTML = "You ran out of time!";
            }

            var distanceContainer = document.getElementById('distanceContainer');
            distanceContainer.style.display = 'block';

            var timerDisplay = document.getElementById('timer');
            timerDisplay.style.display = 'none';

            try {
                // let response = await fetch(https://nominatim.openstreetmap.org/reverse?format=json&lat=${randomLocation.coords[0]}&lon=${randomLocation.coords[1]});
                // let data = await response.json();
                // console.log('Address:', data.display_name);
            } catch (error) {
                console.error('Could not load address information.', error);
            }
        }

        // Funktion zum Starten des Spiels
        function startGame() {
            randomLocation = getRandomLocation();
            document.getElementById('streetview').src = randomLocation.link;
            document.getElementById('guessbtn').style.display = 'block';
            document.querySelector('.map-container').style.display = 'block';
            document.querySelector('.map').style.display = 'block';

            if (!map) {
                initializeMap();
            }

            startTimer(90   , document.getElementById('timer'));

            const mapElement = document.getElementById('map');
            const mouseoverListener = () => {
                mapElement.style.width = '550px';
                mapElement.style.height = '550px';
                map.invalidateSize();
            };
            const mouseoutListener = () => {
                mapElement.style.width = '200px';
                mapElement.style.height = '200px';
                map.invalidateSize();
            };

            mapElement.addEventListener('mouseover', mouseoverListener);
            mapElement.addEventListener('mouseout', mouseoutListener);

            mapElement._mouseoverListener = mouseoverListener;
            mapElement._mouseoutListener = mouseoutListener;
        }

        startGame();
